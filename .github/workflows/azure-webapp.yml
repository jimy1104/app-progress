# Deploys EnglishPro to an Azure App Service (Web App) using its publish profile.
# Setup (once), in GitHub → Settings → Secrets and variables → Actions:
#   Secret   AZURE_WEBAPP_PUBLISH_PROFILE = full content of the .PublishSettings file
#   Variable AZURE_WEBAPP_NAME            = optional; read from the publish profile if missing
name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app name
        id: app
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$PROFILE" ]; then echo "::error::Falta el secreto AZURE_WEBAPP_PUBLISH_PROFILE (Settings → Secrets and variables → Actions → Secrets)"; exit 1; fi
          # The app name is optional: if the variable is not set, read it from the publish profile.
          if [ -z "$APP_NAME" ]; then APP_NAME=$(printf '%s' "$PROFILE" | grep -o 'msdeploySite="[^"]*"' | head -1 | cut -d'"' -f2); fi
          if [ -z "$APP_NAME" ]; then echo "::error::No se encontró el nombre de la Web App. Crea la variable AZURE_WEBAPP_NAME."; exit 1; fi
          echo "Deploying to: $APP_NAME"
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Package site
        run: |
          mkdir -p dist
          cp -r index.html css js samples staticwebapp.config.json server.js package.json web.config dist/

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.app.outputs.name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
